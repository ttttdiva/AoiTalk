[alembic]
script_location = alembic_sync_v3
prepend_sys_path = .
version_table = sync_v3_alembic_version
; The explicit Sync v3 CLI supplies the actual URL for every operation.
sqlalchemy.url = postgresql+psycopg2://127.0.0.1/aoitalk_memory

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
