[alembic]
script_location = alembic
prepend_sys_path = .
; Actual connection info is overridden by alembic/env.py from POSTGRES_* in .env. This is the default.
sqlalchemy.url = postgresql://aoitalk:aoitalk_password@127.0.0.1:5432/aoitalk_memory

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
