[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aoitalk"
version = "0.1.0"
description = "AI-powered voice conversation agent with Discord integration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AoiTalk Team"}
]

# Core dependencies (必須依存 - 会社用エージェントでも使用)
dependencies = [
    # LLM & AI
    "openai>=2.0.0",
    "google-generativeai>=0.3.0",
    "mcp[cli]>=1.0.0,<2.0.0",

    # Web Interface (FastAPI)
    "fastapi>=0.109.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "playwright>=1.55.0",

    # Memory Management (PostgreSQL)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "alembic>=1.12.0",
    "sentence-transformers>=2.2.0,<5.0.0",
    "pydantic>=2.0.0",
    "bcrypt>=4.0.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "itsdangerous>=2.1.0",
    "tiktoken>=0.5.0",
    "psycopg2-binary>=2.9.0",
    "mem0ai>=0.1.0",

    # RAG (Qdrant + LlamaIndex + BGE)
    "qdrant-client>=1.16.0,<1.17.0",
    "llama-index>=0.10.0",
    "llama-index-vector-stores-qdrant>=0.1.0",
    "llama-index-embeddings-huggingface>=0.1.0",
    "llama-index-readers-file>=0.1.0",
    "FlagEmbedding>=1.2.0",
    "pypdf>=3.0.0",

    # Repository Maps
    "grep-ast>=0.3.0",
    "tree-sitter-language-pack>=0.1.0",
    "diskcache>=5.6",
    "tqdm>=4.65",

    # Office File Reading
    "markitdown[docx,pptx,xlsx,pdf]>=0.0.1",
    "openpyxl>=3.1.0",
    "oletools>=0.60.2",
    "extract-msg>=0.55.0",

    # Knowledge Note Frontmatter
    "python-frontmatter>=1.1.0",

    # Video Streaming
    "yt-dlp>=2024.0.0",
    "ffmpeg-python>=0.2.0",

    # Graph Analysis
    "python-louvain>=0.16",
    "networkx>=2.8.0",
    "faiss-cpu>=1.7.0",

    # Core Utilities
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "pywebpush>=2.0.0",
    "certifi>=2026.1.4",
    "aiofiles>=23.0.0",
    "py7zr>=1.1.0,<2.0.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
    "croniter>=1.3.0",
    "nest-asyncio>=1.5.0",
    "psutil>=5.9.0",
    "scipy>=1.11.3",

    # Spotify (Optional but in core)
    "spotipy>=2.24.0",
]

[project.optional-dependencies]
# Audio processing dependencies (音声入出力・TTS・ASR・再生・録音)
audio = [
    # Basic Audio
    "voicevox-client",
    "sounddevice>=0.4.6",
    # recorder.py imports the upstream ``pyaudio`` module on every platform.
    # PyAudioWPatch is additive on Windows (it installs ``pyaudiowpatch`` and
    # ``_portaudiowpatch`` without replacing the upstream pyaudio package).
    "pyaudio",
    "PyAudioWPatch>=0.2.12.8; sys_platform == 'win32'",
    "pydub>=0.25.1",
    "pygame>=2.0.0",

    # TTS & ASR
    "azure-cognitiveservices-speech>=1.31.0",
    "gTTS>=2.3.2",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "openai-whisper>=20230918",
    "nemo-toolkit[asr]>=1.20.0",

    # Discord Voice
    "discord.py>=2.0.0",
    "discord-ext-voice-recv",
    "PyNaCl>=1.5.0",
]

# Windows-specific dependencies (Windows専用)
windows = [
    "pyvcroid2 @ git+https://github.com/Nkyoku/pyvcroid2.git",
    "pythonnet>=3.0.0",
    "pywin32",
]

# Test dependencies (テスト関連)
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.9.0",
    "aiosqlite>=0.19.0",
    "aiohttp>=3.9.0",
    "discord.py>=2.0.0",
    "h2>=4.3.0,<5.0.0",
]

# Irodori-TTS dependencies (Irodori-TTS関連)
irodori = [
    # DACVAE itself is installed by setup.bat/setup.sh with its runtime
    # dependencies explicitly listed.  Its descript-audiotools dependency
    # declares protobuf<3.20, which conflicts with the application's
    # mem0ai protobuf>=5.29.6 requirement; putting DACVAE in this extra would
    # make pip downgrade protobuf and break the existing memory stack.
    "datasets>=3.0.0",
    "huggingface-hub>=0.34.0,<1.0",
    "llvmlite>=0.43.0",
    "numba>=0.60.0",
    "peft>=0.18.0",
    "safetensors>=0.7.0",
    "soundfile>=0.12.0",
    # Fast ModernBERT/LLM-JP tokenizer JSON assets do not use the legacy
    # SentencePiece ABI.  Keep the project-wide >=0.2.1 range shared with
    # MioTTS so combined extras have a single resolver solution.
    "sentencepiece>=0.2.1,<0.3",
    "silentcipher @ git+https://github.com/SesameAILabs/silentcipher.git@d46d7d0893a583d8968ab3a6626e2289faec9152",
    "torch>=2.10.0,<2.11.0",
    "torchaudio>=2.10.0,<2.11.0",
    "torchcodec>=0.10.0,<0.11.0",
    # v4.1-Small uses ModernBERT and runs on transformers 4.57+ as well as the
    # current 5.x API.  The <6 upper bound allows the official v5 runtime when
    # installed alone, while MioTTS/yomi's existing <5 constraints resolve to
    # the tested 4.x compatibility path instead of an impossible dependency
    # intersection.
    "transformers>=4.57.6,<6",
    "tqdm>=4.67.3",
]

# MioTTS dependencies (MioTTS関連)
miotts = [
    "accelerate>=1.12.0",
    "huggingface-hub>=0.34.0,<1.0",
    "miocodec @ git+https://github.com/Aratako/MioCodec@main",
    "safetensors>=0.7.0",
    "sentencepiece>=0.2.1,<0.3",
    "soundfile>=0.12.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "transformers>=4.57.6,<5",
]

# TTS共通の日本語誤読リスク検出（各TTSエンジンから独立）
yomi-linter = [
    "huggingface-hub>=0.34.0,<1.0",
    "safetensors>=0.7.0",
    "torch>=2.2.0,<2.11.0",
    "transformers>=4.48.0,<5",
]

[tool.ruff]
# 初期導入のため致命的ルールのみに限定（構文エラー・比較ミス・未定義名など）
target-version = "py312"
exclude = [
    "src/vendor",
    "venv",
    "node_modules",
    "alembic/versions",
    "frontend",
    "mobile",
    "build",
    "dist",
    ".git",
]

[tool.ruff.lint]
# E9: 構文エラー / F63: 無効な比較 / F7: 構文的に誤ったキーワード使用 / F82: 未定義名
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.vendor.irodori_tts" = ["LICENSE", "VENDORED.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -v --tb=short --ignore=tests/test_image_gen_tool.py"
