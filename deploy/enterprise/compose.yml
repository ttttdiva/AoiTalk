name: aoitalk-enterprise

# This file is the runtime boundary for the sanitized Enterprise handoff.
# secret-contract: generated from secret-schema.json (run generate_secret_contract.py --check).
# deploy-compose.sh builds the local aoitalk image with BuildKit's
# nextauth_secret mount, records its local image ID, and only then invokes this
# Compose file. Dependency images are immutable repository@sha256 references
# generated from bundle-manifest.json; no registry tag is accepted at runtime.

services:
  aoitalk-storage-init:
    image: ${AOITALK_BUSYBOX_IMAGE:?AOITALK_BUSYBOX_IMAGE must be an immutable repository@sha256 digest}
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -ec
      - >-
        mkdir -p /logs /cache /workspaces /tmp-data /huggingface /postgres /qdrant /qdrant-snapshots /caddy-data /caddy-config /logs/web /logs/app /logs/models /logs/startup /logs/desktop /logs/ops /logs/discord
        && chown -R 1000:1000 /logs
        && chown 1000:1000 /cache /workspaces /tmp-data /huggingface /qdrant /qdrant-snapshots /caddy-data /caddy-config
        && chown 999:999 /postgres
    volumes:
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/logs:/logs
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/cache:/cache
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/workspaces:/workspaces
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/tmp:/tmp-data
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/huggingface:/huggingface
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/postgres:/postgres
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/qdrant:/qdrant
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/qdrant-snapshots:/qdrant-snapshots
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/caddy/data:/caddy-data
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/caddy/config:/caddy-config
    restart: "no"

  postgres:
    image: ${AOITALK_POSTGRES_IMAGE:?AOITALK_POSTGRES_IMAGE must be an immutable repository@sha256 digest}
    environment:
      POSTGRES_DB: aoitalk_memory
      POSTGRES_USER: aoitalk
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/postgres:/var/lib/postgresql/data
      - ${AOITALK_INIT_DB_SQL:-../../scripts/init-db.sql}:/docker-entrypoint-initdb.d/10-aoitalk.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoitalk -d aoitalk_memory"]
      interval: 5s
      timeout: 5s
      retries: ${AOITALK_POSTGRES_HEALTHCHECK_RETRIES:-120}
      start_period: ${AOITALK_POSTGRES_HEALTHCHECK_START_PERIOD:-600s}
    depends_on:
      aoitalk-storage-init:
        condition: service_completed_successfully
    networks:
      - aoitalk-network
    restart: unless-stopped

  qdrant:
    image: ${AOITALK_QDRANT_IMAGE:?AOITALK_QDRANT_IMAGE must be an immutable repository@sha256 digest}
    volumes:
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/qdrant:/qdrant/storage
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/qdrant-snapshots:/qdrant/snapshots
    depends_on:
      aoitalk-storage-init:
        condition: service_completed_successfully
    networks:
      - aoitalk-network
    restart: unless-stopped

  qdrant-ready:
    image: ${AOITALK_CURL_IMAGE:?AOITALK_CURL_IMAGE must be an immutable repository@sha256 digest}
    command:
      - sh
      - -ec
      - >-
        until curl -fsS http://qdrant:6333/readyz >/dev/null; do sleep 2; done;
        while curl -fsS http://qdrant:6333/readyz >/dev/null; do sleep 5; done;
        exit 1
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://qdrant:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: ${AOITALK_QDRANT_HEALTHCHECK_RETRIES:-120}
      start_period: ${AOITALK_QDRANT_HEALTHCHECK_START_PERIOD:-600s}
    networks:
      - aoitalk-network
    restart: unless-stopped

  aoitalk:
    image: ${AOITALK_IMAGE:?AOITALK_IMAGE is generated by deploy-compose.sh after the local BuildKit build}
    environment:
      AIVTUBER_ENV: enterprise
      AOITALK_PROFILE: enterprise
      AOITALK_DOCKER: "true"
      AOITALK_REQUIRE_DATABASE: "true"
      AOITALK_REQUIRE_AUTH_SECRET: "true"
      AOITALK_SKIP_CADDY: "true"
      # 3002 is private to aoitalk-network; Caddy owns the public boundary and
      # overwrites forwarding headers before proxying to Next.js.
      AOITALK_LOGIN_TRUST_PROXY: "true"
      AOITALK_HEADLESS: "true"
      AOITALK_SECRET_SCHEMA_FILE: /app/deploy/enterprise/secret-schema.json
      AOITALK_FASTAPI_SESSION_COOKIE: ${AOITALK_FASTAPI_SESSION_COOKIE:-aoitalk_fastapi_session}
      AOITALK_WEB_HOST: 0.0.0.0
      AOITALK_NEXT_HOST: 0.0.0.0
      AOITALK_FRONTEND_HOST: 0.0.0.0
      AOITALK_WEB_AUTO_OPEN: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aoitalk_memory
      POSTGRES_USER: aoitalk
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      USE_POSTGRESQL: "true"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-AoiTalk Enterprise}
      MOONSHOT_API_KEY_FILE: /run/secrets/moonshot_api_key
      MOONSHOT_BASE_URL: ${MOONSHOT_BASE_URL:-}
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      GOOGLE_API_KEY_FILE: /run/secrets/google_api_key
      XAI_API_KEY_FILE: /run/secrets/xai_api_key
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      DEEPINFRA_TOKEN_FILE: /run/secrets/deepinfra_token
      OPENAI_COMPATIBLE_LOCAL_API_KEY_FILE: /run/secrets/openai_compatible_local_api_key
      OLLAMA_API_KEY_FILE: /run/secrets/ollama_api_key
      NIJIVOICE_API_KEY_FILE: /run/secrets/nijivoice_api_key
      OPENWEATHER_API_KEY_FILE: /run/secrets/openweather_api_key
      WEBEX_CLIENT_ID: ${WEBEX_CLIENT_ID:-}
      WEBEX_CLIENT_SECRET_FILE: /run/secrets/webex_client_secret
      WEBEX_REDIRECT_URI: ${WEBEX_REDIRECT_URI:-}
      WEBEX_STATE_SECRET_FILE: /run/secrets/webex_state_secret
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_bot_token
      NEXTAUTH_SECRET_FILE: /run/secrets/nextauth_secret
      AOITALK_WEB_AUTH_SECRET_FILE: /run/secrets/web_auth_secret
      AOITALK_JWT_SECRET_FILE: /run/secrets/jwt_secret
      AOITALK_APP_BRIDGE_SECRET_FILE: /run/secrets/app_bridge_secret
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      INTERNAL_API_KEY_FILE: /run/secrets/internal_api_key
      AOITALK_CADDY_GATE_KEY_FILE: /run/secrets/caddy_gate_key
      AOITALK_BOOTSTRAP_ADMIN_USERNAME: ${AOITALK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      AOITALK_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      AOITALK_FIELD_CRYPTO_KEY_COMMAND: ${AOITALK_FIELD_CRYPTO_KEY_COMMAND:-}
      AOITALK_FIELD_CRYPTO_KEY_B64_FILE: /run/secrets/field_crypto_key_b64
      AOITALK_FIELD_CRYPTO_ALLOW_ENV_KEY: ${AOITALK_FIELD_CRYPTO_ALLOW_ENV_KEY:-false}
      AOITALK_FIELD_CRYPTO_ALLOW_LOCAL_KEY_FILE: ${AOITALK_FIELD_CRYPTO_ALLOW_LOCAL_KEY_FILE:-false}
      AOITALK_FIELD_CRYPTO_LOCAL_KEY_FILE: ${AOITALK_FIELD_CRYPTO_LOCAL_KEY_FILE:-/app/cache/field-crypto.key}
      AOITALK_LLM_MODE: ${AOITALK_LLM_MODE:-external}
      HF_TOKEN_FILE: /run/secrets/hf_token
      HUGGING_FACE_HUB_TOKEN_FILE: /run/secrets/hugging_face_hub_token
      HUGGINGFACE_API_KEY_FILE: /run/secrets/huggingface_api_key
      OPENAI_FREE_TEAM_API_KEY_FILE: /run/secrets/openai_free_team_api_key
      GEMINI_FREE_API_KEY_FILE: /run/secrets/gemini_free_api_key
      OPENROUTER_FREE_TEAM_API_KEY_FILE: /run/secrets/openrouter_free_team_api_key
      GEMINI_PROMO_API_KEY_FILE: /run/secrets/gemini_promo_api_key
      HTTP_PROXY: ${AOITALK_HTTP_PROXY:-}
      HTTPS_PROXY: ${AOITALK_HTTPS_PROXY:-}
      NO_PROXY: ${AOITALK_NO_PROXY:-localhost,127.0.0.1,postgres,qdrant,aoitalk,sglang}
      SGLANG_BASE_URL: ${SGLANG_BASE_URL:-http://sglang:30000/v1}
      SGLANG_MODEL: ${SGLANG_MODEL:-google/gemma-4-E4B-it}
      SGLANG_REASONING_PARSER: ${SGLANG_REASONING_PARSER:-gemma4}
      SGLANG_TOOL_CALL_PARSER: ${SGLANG_TOOL_CALL_PARSER:-gemma4}
      SGLANG_API_KEY_FILE: /run/secrets/sglang_api_key
    secrets:
      - postgres_password
      - nextauth_secret
      - web_auth_secret
      - jwt_secret
      - app_bridge_secret
      - internal_api_key
      - caddy_gate_key
      - bootstrap_admin_password
      - openai_api_key
      - openrouter_api_key
      - moonshot_api_key
      - gemini_api_key
      - google_api_key
      - xai_api_key
      - anthropic_api_key
      - deepseek_api_key
      - deepinfra_token
      - openai_compatible_local_api_key
      - ollama_api_key
      - nijivoice_api_key
      - openweather_api_key
      - webex_client_secret
      - webex_state_secret
      - discord_bot_token
      - auth_secret
      - field_crypto_key_b64
      - sglang_api_key
      - hf_token
      - hugging_face_hub_token
      - huggingface_api_key
      - openai_free_team_api_key
      - gemini_free_api_key
      - openrouter_free_team_api_key
      - gemini_promo_api_key
    volumes:
      - ${AOITALK_BUNDLE_ROOT:-../..}/config:/app/config:ro
      - ${AOITALK_RUNTIME_CONFIG_FILE:?AOITALK_RUNTIME_CONFIG_FILE is required}:/app/config/enterprise.yaml:ro
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/workspaces:/app/workspaces
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/cache:/app/cache
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant-ready:
        condition: service_healthy
      aoitalk-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:3000/health >/dev/null
          && curl -fsS http://127.0.0.1:3002/login >/dev/null
          && curl -fsS http://qdrant:6333/readyz >/dev/null
      interval: 10s
      timeout: 10s
      retries: ${AOITALK_HEALTHCHECK_RETRIES:-60}
      start_period: ${AOITALK_HEALTHCHECK_START_PERIOD:-180s}
    networks:
      - aoitalk-network
    restart: unless-stopped

  caddy:
    image: ${AOITALK_CADDY_IMAGE:?AOITALK_CADDY_IMAGE must be an immutable repository@sha256 digest}
    environment:
      AOITALK_CADDY_SITE_ADDRESS: ${AOITALK_PUBLIC_HOST:-localhost}
      # Caddy's public listener must match the externally published port
      # because Caddy embeds this value in HTTP redirect URLs.
      AOITALK_CADDY_PORT: ${AOITALK_HTTPS_PORT:-6002}
      AOITALK_CADDY_TLS_DIRECTIVE: ${AOITALK_CADDY_TLS_DIRECTIVE:-tls internal}
      AOITALK_BOOTSTRAP_CADDY_PORT: "8443"
      AOITALK_BOOTSTRAP_HTTPS_PORT: ${AOITALK_BOOTSTRAP_HTTPS_PORT:-8443}
      AOITALK_BOOTSTRAP_BIND_ADDRESS: 0.0.0.0
      AOITALK_CADDY_HEALTH_HOST: 127.0.0.1
      AOITALK_CADDY_HEALTH_PORT: "8080"
      AOITALK_CADDY_FASTAPI_UPSTREAM: aoitalk:3000
      AOITALK_CADDY_NEXT_UPSTREAM: aoitalk:3002
      AOITALK_CADDY_ACCESS_LOG: /logs/web/caddy-access.log
      AOITALK_CADDY_RUNTIME_LOG: /logs/web/caddy-runtime.log
      AOITALK_CADDY_GATE_KEY_FILE: /run/secrets/caddy_gate_key
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test -s "$${AOITALK_CADDY_GATE_KEY_FILE}" || {
        echo "Caddy gate secret is missing" >&2; exit 1; };
        export AOITALK_CADDY_GATE_KEY="$$(cat "$${AOITALK_CADDY_GATE_KEY_FILE}")";
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    secrets:
      - caddy_gate_key
    ports:
      - "${AOITALK_PUBLIC_BIND_ADDRESS:-0.0.0.0}:${AOITALK_HTTPS_PORT:-6002}:${AOITALK_HTTPS_PORT:-6002}"
      - "127.0.0.1:${AOITALK_BOOTSTRAP_HTTPS_PORT:-8443}:8443"
    volumes:
      - ${AOITALK_BUNDLE_ROOT:-../..}/caddy/Caddyfile.enterprise:/etc/caddy/Caddyfile:ro
      - "${AOITALK_CADDY_CERTS_DIR:-${AOITALK_DATA_ROOT:-/var/lib/aoitalk}/caddy/certs}:/etc/caddy/certs:ro"
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/caddy/data:/data
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/caddy/config:/config
      - ${AOITALK_DATA_ROOT:?AOITALK_DATA_ROOT is required}/logs:/logs
    depends_on:
      aoitalk:
        condition: service_started
      aoitalk-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          "http://$${AOITALK_CADDY_HEALTH_HOST}:$${AOITALK_CADDY_HEALTH_PORT}/healthz"
      interval: 10s
      timeout: 5s
      retries: ${AOITALK_CADDY_HEALTHCHECK_RETRIES:-60}
      start_period: ${AOITALK_CADDY_HEALTHCHECK_START_PERIOD:-300s}
    networks:
      - aoitalk-network
    restart: unless-stopped

networks:
  aoitalk-network:
    driver: bridge

secrets:
  nextauth_secret:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/nextauth_secret
  postgres_password:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/postgres_password
  web_auth_secret:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/web_auth_secret
  jwt_secret:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/jwt_secret
  app_bridge_secret:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/app_bridge_secret
  internal_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/internal_api_key
  caddy_gate_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/caddy_gate_key
  bootstrap_admin_password:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/bootstrap_admin_password
  openai_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/openai_api_key
  openrouter_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/openrouter_api_key
  moonshot_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/moonshot_api_key
  gemini_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/gemini_api_key
  google_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/google_api_key
  xai_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/xai_api_key
  anthropic_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/anthropic_api_key
  deepseek_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/deepseek_api_key
  deepinfra_token:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/deepinfra_token
  openai_compatible_local_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/openai_compatible_local_api_key
  ollama_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/ollama_api_key
  nijivoice_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/nijivoice_api_key
  openweather_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/openweather_api_key
  webex_client_secret:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/webex_client_secret
  webex_state_secret:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/webex_state_secret
  discord_bot_token:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/discord_bot_token
  auth_secret:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/auth_secret
  field_crypto_key_b64:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/field_crypto_key_b64
  sglang_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/sglang_api_key
  hf_token:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/hf_token
  hugging_face_hub_token:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/hugging_face_hub_token
  huggingface_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/huggingface_api_key
  openai_free_team_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/openai_free_team_api_key
  gemini_free_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/gemini_free_api_key
  openrouter_free_team_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/openrouter_free_team_api_key
  gemini_promo_api_key:
    file: ${AOITALK_SECRETS_DIR:?AOITALK_SECRETS_DIR is required}/gemini_promo_api_key
