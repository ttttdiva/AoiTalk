# Enterprise Linux/WSL profile.
# Runtime secrets and deployment-specific hostnames stay in the untracked .env.

llm_provider: openai_compatible_local
llm_model: google/gemma-4-E4B-it
default_character: project_manager
openai_compatible_local_base_url: http://gemma-vllm:8000/v1

# The launcher treats these values as the persisted/default contract.  The
# effective runtime contract is supplied by the selected Enterprise backend
# overlay and is fail-closed when it does not match the handoff manifest.
enterprise_deployment:
  backend: gemma-vllm
  transport: https
  active_backend: gemma-vllm
  persisted_provider: openai_compatible_local
  persisted_model: google/gemma-4-E4B-it
  persisted_base_url: http://gemma-vllm:8000/v1
  effective_provider: openai_compatible_local
  effective_model: google/gemma-4-E4B-it
  effective_base_url: http://gemma-vllm:8000/v1
  server_profile: vllm

openai_compatible_local:
  server_profile: vllm
  model: google/gemma-4-E4B-it
  base_url: http://gemma-vllm:8000/v1
  tools: true

# The Enterprise model endpoint is an internal Docker service.  Declare its
# hostname explicitly so the outbound privacy boundary classifies the primary
# Gemma/Qwen-compatible generation path as local; public providers still
# require their own approved-egress and credential checks.  A semantic privacy
# sidecar, when enabled for external requests, remains a separate dedicated
# model and never falls back to this primary reasoning model.
external_model_privacy:
  mode: protected
  trusted_local_hosts:
    - gemma-vllm
    - sglang
    - deepseek-llamacpp
    - searxng
    - host.docker.internal

gemma_vllm:
  image: "${AOITALK_GEMMA_VLLM_IMAGE}"
  model: google/gemma-4-E4B-it
  served_model_name: google/gemma-4-E4B-it
  model_revision: ee0ef6023621cff504d758262d4e04895a5af4a2
  model_path: /var/lib/aoitalk/huggingface/gemma-4E4B-it
  model_file: model.safetensors
  model_size_bytes: 15992595884
  base_url: http://gemma-vllm:8000/v1
  host: gemma-vllm
  port: 8000
  dtype: bfloat16
  context_length: 32768
  gpu_architecture: gfx1151
  accelerator: amd-rocm
  tools: true

# Generic NVIDIA SGLang remains available only through the explicit
# `sglang-cuda` overlay. It is not the Enterprise/company default.
sglang_base_url: http://sglang:30000/v1

sglang:
  auto_start: false
  model: google/gemma-4-E4B-it
  base_url: http://127.0.0.1:30000/v1
  port: 30000
  host: 127.0.0.1
  dtype: bfloat16
  mem_fraction_static: 0.8
  reasoning_parser: gemma4
  tool_call_parser: gemma4
  cache:
    enabled: true
    extra_args: []

# Gemma 4 E4B is the initial text model. Disable the unrelated Mage-VL
# managed server so it cannot contend for port 30000 or GPU memory.
mage_vl:
  enabled: false
  managed: false
model_routing:
  classes:
    video:
      inherit: false
      provider: ''
      model: ''
      base_url: ''

web_interface:
  host: 127.0.0.1
  port: 3000
  auto_open_browser: false
  auth:
    enabled: true
    session_ttl_minutes: 1440

runtime_features:
  web_ui: true
  local_mic: false
  local_speaker: false
  tts: false
  discord_bot: false
  discord_text: false
  discord_vc_input: false
  discord_vc_output: false
  console_input: false

mcp_enabled: false
search:
  # Fresh Enterprise databases must use the local search authority.  An
  # operator-explicit hosted provider in persisted settings remains
  # authoritative after egress/credential checks.
  provider: local
  x_enabled: false
  grok_x_enabled: false
  knowledge_enabled: false
agents:
  filesystem:
    enabled: true
  project_management:
    enabled: true
  media:
    enabled: false
  skills:
    enabled: true
  spotify:
    enabled: false
  scenario:
    enabled: false
  writing:
    enabled: false
  import:
    enabled: false

# Ordinary employee Agents may use this capability only from a native Windows
# AoiTalk process, and only for the mediated filesystem/RepoMap APIs.  The
# authenticated AoiTalk user must be explicitly mapped to the current process
# token SID.  Generic native shell/PowerShell remains disabled: a same-token
# process cannot guarantee Project/Docs ACL mediation.  The canonical
# Linux/Docker Enterprise process (shared `aoitalk` identity) is unsupported.
# Keep the capability disabled until the native process and UUID-to-SID token
# verification contract has been tested.  Bindings contain identifiers only;
# credentials and private keys belong in the host secret store.
native_employee_execution:
  enabled: false
  # Logical deployment identifier; this is not a remote shell/broker address.
  endpoint_id: ''
  capability_ttl_seconds: 300
  windows_bindings: {}

spotify:
  enabled: false

# ComfyUIのユーザーワークフローはread-onlyの設定ツリー外へ保存する。
comfyui:
  enabled: false
  workflows_dir: workspaces/comfyui_workflows
  default_workflow: workspaces/comfyui_workflows/aoitalk_auto_sdxl.json
