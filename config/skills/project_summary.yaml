name: project_summary
description: 案件情報DB、重要資料、タスク、WBSから案件サマリを生成する。
prompt_template: |
  案件サマリを生成してください。

  {input}

  ## 手順
  1. project_management_assistant の get_project_context で対象案件を確認する。
  2. list_project_information でカテゴリ、重要資料、ファクト、台帳、同期状態を読む。
  3. list_tasks と get_upcoming_wbs_tasks を使い、タスク/WBS側の直近状況を読む。
  4. 案件情報DBを正本として、以下を整理する。
     - 案件概要
     - 重要資料
     - 最近更新された案件情報
     - 決定事項・要確認事項
     - 構成/詳細設計/検証など、その案件で意味のある大項目
  5. タスクのステータスは「タスク状況」として別枠で扱い、案件情報そのものとして混ぜない。
  6. 案件情報DBに不足や古い情報が見つかった場合は、project_information_update の実行提案を出す。

  ## 出力
  - 案件概要
  - 重要資料
  - 案件情報の主要カテゴリ別サマリ
  - タスク/WBSから見た直近の注意点
  - 更新が必要そうな案件情報
trigger_mode: both
aliases:
  - 案件サマリ
  - サマリ
  - summary
bound_tools:
  - project_management_assistant
examples:
  - "/project_summary"
  - "/project_summary 技術面を重点的に"
  - "/project_summary 重要資料と要確認事項を中心に"
tags:
  - 案件管理
  - 案件情報
  - レポート
parameters: {}
