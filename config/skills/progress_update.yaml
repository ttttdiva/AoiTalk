name: progress_update
description: ユーザーの進捗報告を受けて、タスクと案件情報DBを更新する。
prompt_template: |
  ユーザーから進捗報告がありました。タスクと案件情報DBを更新してください。

  【進捗報告】
  {input}

  ## 手順
  1. get_project_context で対象案件を確認する。
  2. list_project_information で既存の案件情報、重要資料、カテゴリを読む。
  3. list_tasks で関連しそうなタスクを探す。既存タスクがあれば update_task、なければ create_task を使う。
  4. 報告から以下を分離する。
     - タスク側に残す情報: 完了、着手、期限、担当、優先度、次作業
     - 案件情報DBに残す情報: 決定事項、前提、構成/設計/検証の内容、重要資料、要確認事項
  5. 案件情報DBに残すべき内容があれば upsert_project_info_category、register_project_document、upsert_project_fact で反映する。
  6. 単なるステータスや進捗率だけを案件情報ファクトにしない。

  ## 出力
  - 更新/作成したタスク
  - 更新/作成した案件情報
  - 反映しなかった情報と理由
trigger_mode: both
aliases:
  - 進捗更新
  - 進捗報告
  - update_progress
bound_tools:
  - get_project_context
  - list_project_information
  - list_tasks
  - create_task
  - update_task
  - upsert_project_info_category
  - register_project_document
  - upsert_project_fact
examples:
  - "/progress_update 設計レビュー完了、明日から構築開始"
  - "/progress_update NW機器の設定投入が完了。課題：ファイアウォールのルール確認待ち"
  - "/progress_update 構成図が更新された。正本は management/network-diagram.vsdx"
tags:
  - 案件管理
  - タスク
  - 案件情報
parameters: {}
